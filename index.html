<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>ColiseumCompass</title>

	<link rel="stylesheet" href="index.css">
	
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body>

<div class="inputcontainer">
	<select id="level">
		<option value="stalls" selected>Stalls</option>
		<option value="dress-circle">Dress Circle</option>
		<option value="upper-circle">Upper Circle</option>
		<option value="balcony">Balcony</option>
	</select>
	
	<input type="text" id="seatId" placeholder="e.g. B21">
</div>
<div class="mapcontainer">
	<svg class="map" id="map" viewBox="0 0 4960 1280" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
		<!-- Background image -->
		<image href="StallsAnnotated.png" x="0" y="0" width="4960" height="1280" />
	</svg>
</div>
<div class="zoom-slider-container">
	<label class="zoom-label" for="zoom-slider">Reset</label>
	<input type="range" class="zoom-slider" id="zoom-slider" min="1" max="8" step="0.01" value="1">
	<label class="zoom-label" for="zoom-slider">Zoom</label>
</div>
<div class="routecontainer">
	<div id="route" class="route">
	</div>
</div>

<div id="version" class="version">
	<a style="cursor: pointer" onclick="window.open('https://www.youtube.com/watch?v=xvFZjo5PgG0', '_blank')"><img src="Logo.png" class="logo"></a>

	v2.1.1<br>
	Changes:<br>
	- Reworked zoom controls<br>
	- Auto-pans to seat<br>
	- QOL zoom/pan features<br>
	- Labelled Pillars<br>
	<br>
	Made by Joe Banks
</div>

<script src="svg-pan-zoom.min.js"></script>
<script src="map.js"></script>
<script src="script.js"></script>

</body>
</html>
